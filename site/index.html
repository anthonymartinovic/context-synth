<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Context Synth</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1/dist/fonts/geist-sans/style.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Geist Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 340px;
    }

    .logo {
      width: 100%;
    }

    .logo img {
      width: 90%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .tagline {
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0.01em;
      color: #1a1a1a;
      text-align: center;
    }

    .links {
      position: absolute;
      bottom: 25%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 38px;
      align-items: center;
    }

    .links a {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1a1a1a;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .links a:hover {
      transform: scale(1.15);
    }

    .links a.discord:hover {
      color: #5865F2;
    }

    .links a.youtube:hover {
      color: #FF0000;
    }

    .links a svg {
      width: 34px;
      height: 34px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="main">
    <div class="logo">
      <img src="assets/logo.png" alt="Context Synth">
    </div>
    <p class="tagline">A context-driven orchestration framework <br>for governed AI reasoning</p>
  </div>
